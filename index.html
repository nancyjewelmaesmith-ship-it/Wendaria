<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.E.N.D.A.R.I.A // Mk.I</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0A0D14;
            color: #E0E6ED;
            font-family: 'Consolas', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        
        /* Left Tactical Sidebar HUD Layout */
        .sidebar {
            width: 320px;
            background-color: #070A0F;
            border-right: 2px solid #00E5FF;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 5px 0 15px rgba(0, 229, 255, 0.05);
        }
        .sidebar h2 {
            color: #00E5FF;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
            border-bottom: 1px solid #1A2333;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }
        .hud-metric {
            background: #101524;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #00E5FF;
        }
        .hud-metric label {
            font-size: 0.75rem;
            color: #8A99AD;
            display: block;
            margin-bottom: 4px;
        }
        .hud-metric .value {
            font-size: 1.3rem;
            color: #00E5FF;
            font-weight: bold;
        }

        /* Main Workspace Terminal Panel */
        .main-canvas {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
        }
        .header-banner {
            color: #00E5FF;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
            margin-bottom: 20px;
        }
        
        /* Central Interactive Log Feed */
        .terminal-log {
            flex: 1;
            background-color: #06080D;
            border: 1px solid #1A2333;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .log-entry {
            margin-bottom: 14px;
            line-height: 1.5;
            animation: fadeIn 0.15s ease-out;
        }
        .user-line { color: #8A99AD; font-weight: bold; }
        .wendaria-line { 
            color: #E0E6ED; 
            white-space: pre-wrap;
            border-left: 3px solid #00E5FF;
            padding-left: 10px;
            margin-top: 4px;
        }

        /* Universal CommandLine Input Box */
        .console-dock {
            display: flex;
            background-color: #101524;
            border: 1px solid #1A2333;
            border-radius: 4px;
            padding: 5px 15px;
            align-items: center;
        }
        .console-prompt {
            color: #00E5FF;
            font-weight: bold;
            margin-right: 15px;
        }
        .console-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #E0E6ED;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
            padding: 10px 0;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Left Tactical Sidebar HUD -->
    <div class="sidebar">
        <h2>⚙️ WENDARIA HUD</h2>
        <div class="hud-metric">
            <label>CHRONO VECTOR</label>
            <div class="value" id="live-clock">00:00:00</div>
        </div>
        <div class="hud-metric">
            <label>SYSTEM CORE ARCH</label>
            <div class="value">W.E.N.D.A.R.I.A</div>
        </div>
        <div class="hud-metric">
            <label>PLATFORM MODE</label>
            <div class="value" style="color: #00FF88;">SERVERLESS</div>
        </div>
    </div>

    <!-- Main Command Dashboard Canvas -->
    <div class="main-canvas">
        <div class="header-banner">🌐 W.E.N.D.A.R.I.A // Mk.I</div>
        
        <div class="terminal-log" id="terminalLog">
            <div class="log-entry">
                <div class="wendaria-line">W.E.N.D.A.R.I.A: Core web infrastructure stabilized. Standing by for interface sequencing...</div>
            </div>
        </div>

        <!-- Custom Command Dock Layer -->
        <div class="console-dock">
            <span class="console-prompt">sys_node></span>
            <input type="text" class="console-input" id="consoleInput" placeholder="Enter command protocol..." autofocus autocomplete="off">
        </div>
    </div>

    <script>
        // --- SECURE INITIAL PERFORMANCE METRICS ---
        const pageLoadTime = Date.now();
        let totalDirectivesProcessed = 0;

        // --- EXPLICIT DATA CONFIGURATION LAYER (Your dialogues array) ---
        const DIALOGUES = {
            greetings: [
                "W.E.N.D.A.R.I.A: Good day. Platform matrix is initialized. Session telemetry synchronized.",
                "W.E.N.D.A.R.I.A: Cloud nodes operational. Web interface running at optimal efficiency.",
                "W.E.N.D.A.R.I.A: Core framework initialized successfully. Standing by for instruction.",
                "W.E.N.D.A.R.I.A: Secure web shell active. All system parameters verifying nominal.",
                "W.E.N.D.A.R.I.A: Platform interface responsive. Local node ready for input sequencing."
            ],
            time: [
                "W.E.N.D.A.R.I.A: Chrono vector synchronized. Current system time is {val} UTC.",
                "W.E.N.D.A.R.I.A: Temporal sync active. The dashboard clock registers {val}.",
                "W.E.N.D.A.R.I.A: Mainframe timeline validated. System metrics recorded at {val}.",
                "W.E.N.D.A.R.I.A: Universal 24-hour baseline checked. System temporal axis: {val}.",
                "W.E.N.D.A.R.I.A: Master network clock pulse received. Epoch timestamp correlates to {val}."
            ],
            date: [
                "W.E.N.D.A.R.I.A: Calendar matrix confirmed. Today's date is {val}.",
                "W.E.N.D.A.R.I.A: Platform log verification index: {val}.",
                "W.E.N.D.A.R.I.A: System dateline verified. Core scheduling is synced to {val}.",
                "W.E.N.D.A.R.I.A: Interface chronological sync complete. Active log calendar: {val}.",
                "W.E.N.D.A.R.I.A: Mainframe ledger timestamp verified. Current routing date: {val}."
            ],
            session: [
                "W.E.N.D.A.R.I.A: Parsing state variables. Active tracking array holds {val} transaction frames.",
                "W.E.N.D.A.R.I.A: Interface storage inspected. Memory stack registers {val} interactive logs in the state array.",
                "W.E.N.D.A.R.I.A: Session backlogs verified. Currently caching {val} distinct dialogue payloads.",
                "W.E.N.D.A.R.I.A: Local session memory footprint assessed. State cache holds {val} data frames.",
                "W.E.N.D.A.R.I.A: Analyzing persistent browser states. Transaction array tracking {val} elements."
            ],
            uptime: [
                "W.E.N.D.A.R.I.A: Host node availability check complete. Total system operational uptime is {val}.",
                "W.E.N.D.A.R.I.A: Cloud container life-cycle verified. Continuous execution time: {val}.",
                "W.E.N.D.A.R.I.A: Mainframe heartbeat nominal. Node has been steadily online for {val}.",
                "W.E.N.D.A.R.I.A: Infrastructure availability metric evaluated. Host node runtime index: {val}.",
                "W.E.N.D.A.R.I.A: Processing engine deployment endurance logged. Container runtime: {val}."
            ],
            ping: [
                "W.E.N.D.A.R.I.A: WebSocket data packet handshake confirmed. Edge response pipeline latency: {val}ms.",
                "W.E.N.D.A.R.I.A: Diagnostic ping sequence returned. Internal routing matrix lag: {val}ms.",
                "W.E.N.D.A.R.I.A: Network route latency benchmarked. Direct pipe speed calculated at {val}ms.",
                "W.E.N.D.A.R.I.A: Real-time data pipeline polling completed. Handshake response delta: {val}ms.",
                "W.E.N.D.A.R.I.A: Outbound socket echo verified. Mainframe transport layer turnaround: {val}ms."
            ],
            errors: [
                "W.E.N.D.A.R.I.A: Directive '{val}' could not be mapped within the platform UI matrix.",
                "W.E.N.D.A.R.I.A: My apologies, but the web interface does not recognize the routing parameter '{val}'.",
                "W.E.N.D.A.R.I.A: Error: Instruction '{val}' bypasses all registered routing paths. Check syntax directory.",
                "W.E.N.D.A.R.I.A: Command '{val}' dropped by the micro-router layer. No executable endpoint exists.",
                "W.E.N.D.A.R.I.A: System warning: Direct command string '{val}' was rejected by the active core framework."
            ]
        };

        // --- HELPER METRIC CALCULATORS ---
        function getPick(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function formatPHTime() {
            const now = new Date();
            const phTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3600000 * 8));
            return phTime.toTimeString().split(' ')[0];
        }

        // --- TRUE BACKGROUND CLOCK TICKER ---
        function updateClock() {
            document.getElementById('live-clock').innerText = formatPHTime();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- CLIENT-SIDE OPERATIONS ROUTING MATRIX (Your old commands.py) ---
        const COMMAND_REGISTRY = {
            "hello": () => getPick(DIALOGUES.greetings),
            "hi": () => getPick(DIALOGUES.greetings),
            "time": () => getPick(DIALOGUES.time).replace("{val}", formatPHTime()),
            "date": () => {
                const now = new Date();
                const phTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3600000 * 8));
                const dateStr = phTime.toISOString().split('T')[0];
                return getPick(DIALOGUES.date).replace("{val}", dateStr);
            },
            "platform status": () => {
                return "W.E.N.D.A.R.I.A: Executing Client-Node Platform Sweep...\n\n- **Client Execution Layer:** Live HTML5 Engine\n- **Session Architecture:** Non-Volatile Memory Array\n- **Data Pipeline Layer:** Pure Static Micro-Router\nWeb application framework is structurally fully optimized.";
            },
            "system telemetry": () => {
                // Generates dynamic frontend browser performance readings
                const mem = window.performance && window.performance.memory ? (window.performance.memory.usedJSHeapSize / (1024 * 1024)).toFixed(2) + " MB" : "OPTIMAL";
                return `W.E.N.D.A.R.I.A: Fetching live browser edge-node metrics...\n\n- **Application PID:** \`BROWSER_THREAD\`\n- **Container Script Engine:** \`JavaScript V8 / SpiderMonkey\`\n- **Active Client Memory Allocated:** \`${mem}\`\n- **Platform Core State:** \`HEALTHY // OPERATIONAL\``;
            },
            "network audit": () => {
                return "W.E.N.D.A.R.I.A: Auditing current network socket layers...\n\n- **Active Listening Sockets:** `0 (CLIENT_ISOLATED)`\n- **Established Web Handshakes:** `1 (LOCAL_CANVAS)`\n- **Data Pipeline Encryption:** `SECURE CLIENT SANITATION`\nUpstream network socket pathways are entirely clear and verified.";
            },
            "session diagnostics": () => {
                return getPick(DIALOGUES.session).replace("{val}", totalDirectivesProcessed);
            },
            "system uptime": () => {
                const diff = Math.floor((Date.now() - pageLoadTime) / 1000);
                const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
                const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                const secs = String(diff % 60).padStart(2, '0');
                return getPick(DIALOGUES.uptime).replace("{val}", `${hrs}h ${mins}m ${secs}s`);
            },
            "ping loop": () => {
                const latency = (Math.random() * 0.05).toFixed(3); // Instant client execution speeds
                return getPick(DIALOGUES.ping).replace("{val}", latency);
            },
            "export session": () => {
                return "W.E.N.D.A.R.I.A: Client window log array compiled. Ready for secure data transport.";
            }
        };

        // --- PROTOCOL TRANSACTION MANAGER ---
        const consoleInput = document.getElementById('consoleInput');
        const terminalLog = document.getElementById('terminalLog');

        consoleInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const directive = this.value.trim();
                if (!directive) return;

                totalDirectivesProcessed++;

                // Log user action
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.innerHTML = `<div class="user-line">> ${directive}</div>`;
                terminalLog.appendChild(logEntry);
                
                this.value = '';
                terminalLog.scrollTop = terminalLog.scrollHeight;

                const cleanCmd = directive.toLowerCase().strip ? directive.toLowerCase().strip() : directive.toLowerCase();

                // Direct screen clear mechanism
                if (cleanCmd === 'clear' || cleanCmd === 'cls') {
                    terminalLog.innerHTML = '<div class="log-entry"><div class="wendaria-line">W.E.N.D.A.R.I.A: Display log layer cleared. Core parameters operational.</div></div>';
                    return;
                }

                // Check and execute command match completely in the browser
                let outputResponse = "";
                if (COMMAND_REGISTRY[cleanCmd]) {
                    outputResponse = COMMAND_REGISTRY[cleanCmd]();
                } else {
                    // Check for partial command inclusion loops
                    let matched = false;
                    for (const key in COMMAND_REGISTRY) {
                        if (cleanCmd.includes(key)) {
                            outputResponse = COMMAND_REGISTRY[key]();
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        outputResponse = getPick(DIALOGUES.errors).replace("{val}", directive);
                    }
                }

                // Append output seamlessly
                const responseLine = document.createElement('div');
                responseLine.className = 'wendaria-line';
                responseLine.innerText = outputResponse;
                logEntry.appendChild(responseLine);

                terminalLog.scrollTop = terminalLog.scrollHeight;
            }
        });
    </script>
</body>
</html>
